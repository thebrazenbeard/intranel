name: test

on:
  push:
    branches:
      - work/intranel-v1-protocol-20260917
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Guard editor startup source (preinstall)
        run: python scripts/check_editor_startup_source.py
      - name: Guard regression tests (preinstall)
        run: python -m unittest discover -s tests -p test_editor_startup_guard.py -v
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
